<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Smoke Test Generator - Demo</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel panel-intake">
        <div class="heading-wrap">
          <p class="kicker">
            <span class="dot" aria-hidden="true"></span>
            Prototype 2026-03-06-p001
          </p>
          <h1>Pricing Smoke Test Generator</h1>
          <p class="subtitle">
            Draft three test-ready pricing tiers in minutes, then copy a variant link and tracking notes.
          </p>
        </div>

        <form id="generatorForm" novalidate>
          <label for="productName">Product name</label>
          <input id="productName" name="productName" type="text" placeholder="Example: InsightPilot" required />

          <label for="persona">Target persona</label>
          <input id="persona" name="persona" type="text" placeholder="Example: RevOps manager at SaaS teams" required />

          <label for="valueMetric">Proposed value metric</label>
          <input id="valueMetric" name="valueMetric" type="text" placeholder="Example: active deals tracked" required />

          <p id="formHint" class="hint" aria-live="polite">Fill all fields, then generate variants.</p>

          <button id="generateBtn" type="submit" class="btn-primary">Generate 3 variants</button>
        </form>
      </section>

      <section class="panel panel-results">
        <div class="toolbar" role="group" aria-label="Billing cadence">
          <button type="button" class="cycle is-active" data-cycle="monthly" aria-pressed="true">Monthly</button>
          <button type="button" class="cycle" data-cycle="annual" aria-pressed="false">Annual</button>
        </div>

        <div class="cards-header">
          <h2>Pricing variants</h2>
          <button id="copyBtn" type="button" class="btn-secondary" disabled>Copy UTM link</button>
        </div>

        <div id="cards" class="cards" aria-live="polite"></div>

        <aside class="tracking" aria-live="polite">
          <h3>Tracking plan</h3>
          <p id="trackingSummary">Generate variants to see tracking details.</p>
          <ul id="trackingList"></ul>
        </aside>
      </section>
    </main>

    <script src="./assets/app.js" defer></script>
  </body>
</html>
