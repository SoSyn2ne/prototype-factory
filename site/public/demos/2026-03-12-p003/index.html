<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPU Maintenance Checklist Runner - Form Demo</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="split">
      <section class="brand">
        <p class="id">2026-03-12-p003</p>
        <h1>GPU Maintenance Checklist Runner</h1>
        <p>A tiny runbook UI that turns server maintenance into a timed checklist with notes + exportable incident log.</p>
      </section>
      <section class="card-wrap">
        <form class="card" aria-label="Intake form">
          <h2>Project intake</h2>
          <label>
            Prototype goal
            <input type="text" placeholder="What should this prototype prove?" />
          </label>
          <label>
            Primary persona
            <input type="text" placeholder="Who is this for?" />
          </label>
          <label>
            Constraints
            <textarea id="constraints" rows="4" placeholder="Time, budget, technical limits..."></textarea>
          </label>
          <div class="foot">
            <span id="counter">0 / 280</span>
            <button type="button">Submit draft</button>
          </div>
        </form>
      </section>
    </main>
    <script src="./assets/app.js" defer></script>
  </body>
</html>
