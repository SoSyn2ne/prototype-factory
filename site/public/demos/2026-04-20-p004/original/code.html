<!DOCTYPE html>

<html class="scroll-smooth" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Windowlight Dinner Club</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#bbb9b2",
                        "surface-container-high": "#f0eee6",
                        "primary-container": "#bbece6",
                        "secondary-fixed-dim": "#edcebd",
                        "error-dim": "#67040d",
                        "inverse-on-surface": "#9e9d98",
                        "surface": "#fffcf7",
                        "on-tertiary-fixed": "#043f53",
                        "tertiary-fixed": "#b2e1fa",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#fcdccb",
                        "outline": "#81817a",
                        "error-container": "#fa746f",
                        "secondary": "#775f52",
                        "background": "#fffcf7",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#2b5955",
                        "on-primary-fixed": "#164642",
                        "primary-fixed": "#bbece6",
                        "error": "#af3d3b",
                        "on-tertiary-container": "#215267",
                        "on-surface": "#383833",
                        "surface-container-highest": "#eae8e0",
                        "primary": "#3e6c68",
                        "surface-dim": "#e4e3da",
                        "tertiary-fixed-dim": "#a4d3eb",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#2c5c70",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#634d40",
                        "surface-container-low": "#fcf9f3",
                        "on-background": "#383833",
                        "surface-variant": "#eae8e0",
                        "surface-bright": "#fffcf7",
                        "inverse-primary": "#ccfdf7",
                        "surface-tint": "#3e6c68",
                        "secondary-dim": "#6a5346",
                        "on-tertiary": "#ffffff",
                        "primary-dim": "#32605c",
                        "surface-container": "#f6f3ec",
                        "primary-fixed-dim": "#aeded8",
                        "on-surface-variant": "#65655e",
                        "secondary-fixed": "#fcdccb",
                        "on-secondary-fixed": "#4f3b2f",
                        "tertiary-container": "#b2e1fa",
                        "on-primary-fixed-variant": "#35635f",
                        "tertiary-dim": "#2e5e73",
                        "tertiary": "#3b6a7f",
                        "on-error-container": "#6e0a12",
                        "inverse-surface": "#0e0e0c",
                        "on-secondary-fixed-variant": "#6e5749"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": [
                            "Plus Jakarta Sans"
                        ],
                        "body": [
                            "Manrope"
                        ],
                        "label": [
                            "Manrope"
                        ]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fffcf7]/80 dark:bg-[#383833]/80 backdrop-blur-xl shadow-[0_20px_40px_rgba(56,56,51,0.06)] tonal shift using bg-[#f6f3ec] dark:bg-[#4a4a45] transition-opacity hover:opacity-80">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<span class="text-2xl font-bold text-[#3e6c68] dark:text-[#bbece6] italic font-['Plus_Jakarta_Sans']">SereneDining</span>
</div>
<div class="flex items-center gap-4 text-[#3e6c68] dark:text-[#bbece6]">
<button aria-label="camera_enhance" class="p-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="camera_enhance">camera_enhance</span>
</button>
<button aria-label="person" class="p-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="person">person</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-6 md:px-12 lg:px-24 flex flex-col md:flex-row gap-8 max-w-[1600px] mx-auto w-full">
<!-- Left Column: Stage & Presence -->
<div class="flex-1 flex flex-col gap-8">
<!-- Ambient Dinner Stage -->
<section class="relative rounded-xl overflow-hidden shadow-[0_40px_80px_rgba(56,56,51,0.06)] bg-surface-container-lowest group" style="height: 50vh; min-height: 400px;">
<img alt="Dinner Stage" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="cinematic dusk lighting coming through a window illuminating a rustic dinner table set for one, soft golden and deep blue tones, cinematic moody feel" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwQXtx87iZGDDKri4EMHMFbbb3i5w1DyGiYqcJUWfXWEVnSTlrKcd6J0kR46-tWMXihS1K8ow9Dgdqr1xiIWSAs2uYwhBzzap8Z_7_yBdNKIG33EBTptCywUJInRfENxmxkboFEHlqoBhzLfA-y-YLyqbpPFbQJ4xzaQS3Uw1uFq6Tijur1616VB-BXR8YjFP1ER8VRWqtWo_6WzZaa5eMM3DRJjqYb4bnVZzOdd7Z9YzadOdLH4o5PcgLyDIQnACBulz-EvRHQpQ"/>
<!-- Glass Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-on-background/80 via-transparent to-transparent pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-full p-8 text-on-primary">
<h1 class="font-headline text-4xl md:text-5xl font-bold mb-2 tracking-tight">The Dusk Room</h1>
<p class="font-body text-lg opacity-90">3 fellow diners are quietly eating in this light.</p>
</div>
</section>
<!-- Anonymous Presence Feed -->
<section class="bg-surface-container-low rounded-xl p-8">
<h2 class="font-headline text-2xl font-semibold mb-6 text-on-surface">Quiet Company</h2>
<div class="flex flex-col gap-4">
<!-- Presence Item -->
<div class="flex items-center gap-4 p-4 rounded-lg bg-surface-container-lowest shadow-sm hover:shadow-md transition-shadow">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" data-icon="local_cafe">local_cafe</span>
</div>
<div>
<p class="font-body text-sm font-medium text-on-surface">Someone poured tea.</p>
<p class="font-body text-xs text-on-surface-variant">Just now</p>
</div>
</div>
<!-- Presence Item -->
<div class="flex items-center gap-4 p-4 rounded-lg bg-surface-container-lowest shadow-sm hover:shadow-md transition-shadow">
<div class="w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
</div>
<div>
<p class="font-body text-sm font-medium text-on-surface">A chair was pulled up.</p>
<p class="font-body text-xs text-on-surface-variant">2 mins ago</p>
</div>
</div>
</div>
</section>
</div>
<!-- Right Column: Controls & Rituals -->
<div class="w-full md:w-96 flex flex-col gap-8">
<!-- Mood Table Selector -->
<section class="bg-surface-container rounded-xl p-6">
<h3 class="font-headline text-xl font-semibold mb-4 text-on-surface">Change Table</h3>
<div class="grid grid-cols-2 gap-4">
<button class="h-24 rounded-lg bg-gradient-to-br from-primary to-primary-container p-4 flex flex-col justify-end text-left transition-transform hover:-translate-y-1">
<span class="font-headline text-on-primary font-medium">Dusk</span>
</button>
<button class="h-24 rounded-lg bg-surface-container-lowest border border-outline-variant/30 p-4 flex flex-col justify-end text-left transition-transform hover:-translate-y-1">
<span class="font-headline text-on-surface font-medium">Midnight</span>
</button>
<button class="h-24 rounded-lg bg-surface-container-lowest border border-outline-variant/30 p-4 flex flex-col justify-end text-left transition-transform hover:-translate-y-1">
<span class="font-headline text-on-surface font-medium">Dawn</span>
</button>
<button class="h-24 rounded-lg bg-surface-container-lowest border border-outline-variant/30 p-4 flex flex-col justify-end text-left transition-transform hover:-translate-y-1">
<span class="font-headline text-on-surface font-medium">Rain</span>
</button>
</div>
</section>
<!-- Room Warmth Meter -->
<section class="bg-surface-container-highest rounded-xl p-6">
<div class="flex justify-between items-center mb-4">
<h3 class="font-headline text-lg font-semibold text-on-surface">Room Warmth</h3>
<span class="material-symbols-outlined text-secondary" data-icon="flare">flare</span>
</div>
<div class="h-4 bg-surface rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-secondary-container to-secondary w-[65%] rounded-full"></div>
</div>
<p class="font-body text-xs text-on-surface-variant mt-2 text-right">Cozy</p>
</section>
<!-- Tiny Gesture Tray -->
<section class="bg-surface-container-low rounded-xl p-6">
<h3 class="font-headline text-lg font-semibold mb-4 text-on-surface">Leave a Gesture</h3>
<div class="flex justify-around">
<button class="w-14 h-14 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-primary hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
</button>
<button class="w-14 h-14 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-primary hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="wine_bar">wine_bar</span>
</button>
<button class="w-14 h-14 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-primary hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="music_note">music_note</span>
</button>
</div>
</section>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-[#fffcf7]/80 dark:bg-[#383833]/80 backdrop-blur-xl rounded-t-[3rem] shadow-[0_-10px_40px_rgba(56,56,51,0.06)] tonal shift from surface to surface-container-low md:hidden">
<!-- Active Tab: Stage -->
<button class="flex flex-col items-center justify-center bg-[#bbece6] dark:bg-[#3e6c68] text-[#3e6c68] dark:text-[#ffffff] rounded-full px-6 py-2 transform scale-90 duration-300 ease-out font-['Manrope'] text-[11px] font-medium tracking-wide">
<span class="material-symbols-outlined mb-1" data-icon="local_dining" data-weight="fill" style="font-variation-settings: 'FILL' 1;">local_dining</span>
<span>Stage</span>
</button>
<!-- Inactive Tabs -->
<button class="flex flex-col items-center justify-center text-[#bbb9b2] dark:text-[#8b8b85] px-6 py-2 hover:text-[#3e6c68] dark:hover:text-[#bbece6] transition-colors font-['Manrope'] text-[11px] font-medium tracking-wide">
<span class="material-symbols-outlined mb-1" data-icon="auto_awesome">auto_awesome</span>
<span>Rituals</span>
</button>
<button class="flex flex-col items-center justify-center text-[#bbb9b2] dark:text-[#8b8b85] px-6 py-2 hover:text-[#3e6c68] dark:hover:text-[#bbece6] transition-colors font-['Manrope'] text-[11px] font-medium tracking-wide">
<span class="material-symbols-outlined mb-1" data-icon="flare">flare</span>
<span>Warmth</span>
</button>
<button class="flex flex-col items-center justify-center text-[#bbb9b2] dark:text-[#8b8b85] px-6 py-2 hover:text-[#3e6c68] dark:hover:text-[#bbece6] transition-colors font-['Manrope'] text-[11px] font-medium tracking-wide">
<span class="material-symbols-outlined mb-1" data-icon="menu_book">menu_book</span>
<span>Journal</span>
</button>
</nav>
</body></html>
