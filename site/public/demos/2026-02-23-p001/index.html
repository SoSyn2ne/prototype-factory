<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thesis Delta Alerts Demo</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <p class="id">2026-02-23-p001</p>
        <h1>Thesis Delta Alerts</h1>
        <p>
          Compare yesterday's thesis vs today's changes and promote only material
          deltas into action-ready alert cards.
        </p>
      </header>

      <section class="toolbar">
        <label for="ticker">Thesis</label>
        <select id="ticker">
          <option value="nvda">NVDA AI Demand Thesis</option>
          <option value="asml">ASML Capacity Thesis</option>
        </select>

        <label class="switch">
          <input id="material-only" type="checkbox" />
          <span>Show only material changes</span>
        </label>
      </section>

      <section class="layout">
        <article class="panel">
          <h2>Diff View</h2>
          <div id="diff-rows" class="diff"></div>
        </article>

        <article class="panel">
          <h2>Alert Cards</h2>
          <div id="alert-cards" class="cards"></div>
        </article>
      </section>
    </main>

    <script src="./assets/app.js" defer></script>
  </body>
</html>
