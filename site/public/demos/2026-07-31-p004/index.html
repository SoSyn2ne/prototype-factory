<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KR 편의점 시프트/알바비 Penalty 시뮬레이터 - Form Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="split">
      <section class="brand">
        <p class="id">2026-07-31-p004</p>
        <h1>KR 편의점 시프트/알바비 Penalty 시뮬레이터</h1>
        <p>편의점 점주가 매출/시급/시프트/직접 노동시간/4대보험을 입력하면 2026 최저임금 1.3만 + 주휴수당 + 알바 penalty까지 3 시나리오 + 시프트 7칸 + 지원금 CTA를 한 화면에서 시뮬레이션.</p>
      </section>
      <section class="card-wrap">
        <form class="card" aria-label="Intake form">
          <h2>Project intake</h2>
          <label>
            Prototype goal
            <input type="text" placeholder="What should this prototype prove?" />
          </label>
          <label>
            Primary persona
            <input type="text" placeholder="Who is this for?" />
          </label>
          <label>
            Constraints
            <textarea id="constraints" rows="4" placeholder="Time, budget, technical limits..."></textarea>
          </label>
          <div class="foot">
            <span id="counter">0 / 280</span>
            <button type="button">Submit draft</button>
          </div>
        </form>
      </section>
    </main>
    <script src="./assets/app.js" defer></script>
  </body>
</html>
