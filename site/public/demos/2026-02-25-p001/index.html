<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Signal Churn Radar Demo</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="layout">
      <header class="hero">
        <p class="id">2026-02-25-p001</p>
        <h1>Public Signal Churn Radar</h1>
        <p>
          Watchlist of products with churn-risk scoring from public signals.
          Select any product to inspect score drivers and confidence.
        </p>
      </header>

      <section class="grid">
        <article class="panel">
          <h2>Watchlist</h2>
          <ul id="watchlist" class="watchlist"></ul>
        </article>

        <article class="panel details" aria-live="polite">
          <h2 id="product-name">-</h2>
          <p class="risk-line">
            Risk score: <strong id="risk-score">0</strong>
            <span id="risk-label" class="badge">Green</span>
          </p>

          <h3>Driver breakdown</h3>
          <div id="drivers" class="drivers"></div>
        </article>
      </section>
    </main>

    <script src="./assets/app.js" defer></script>
  </body>
</html>
