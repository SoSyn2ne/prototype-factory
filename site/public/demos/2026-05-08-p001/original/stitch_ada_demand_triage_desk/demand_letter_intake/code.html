<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ADA.OPS_REMEDIATION - Intake</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#b9c7e0",
                        "primary-fixed": "#dae2fd",
                        "on-secondary": "#233144",
                        "surface": "#131315",
                        "secondary": "#b9c7e0",
                        "on-secondary-fixed-variant": "#3a485c",
                        "surface-container-high": "#2a2a2b",
                        "on-tertiary-fixed": "#191c1e",
                        "inverse-surface": "#e4e2e4",
                        "error": "#ffb4ab",
                        "primary-fixed-dim": "#bec6e0",
                        "on-surface": "#e4e2e4",
                        "on-tertiary": "#2d3133",
                        "primary": "#bec6e0",
                        "surface-variant": "#353436",
                        "on-secondary-fixed": "#0d1c2f",
                        "on-primary-container": "#798098",
                        "inverse-primary": "#565e74",
                        "surface-container-low": "#1b1b1d",
                        "inverse-on-surface": "#303032",
                        "on-error-container": "#ffdad6",
                        "secondary-container": "#3c4a5e",
                        "on-primary-fixed-variant": "#3f465c",
                        "tertiary": "#c4c7c9",
                        "background": "#131315",
                        "surface-bright": "#39393b",
                        "outline": "#909097",
                        "tertiary-container": "#15181a",
                        "surface-container": "#1f1f21",
                        "surface-tint": "#bec6e0",
                        "on-primary": "#283044",
                        "surface-dim": "#131315",
                        "primary-container": "#0f172a",
                        "secondary-fixed": "#d5e3fd",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "on-tertiary-container": "#7e8183",
                        "surface-container-lowest": "#0e0e10",
                        "on-surface-variant": "#c6c6cd",
                        "on-tertiary-fixed-variant": "#444749",
                        "on-secondary-container": "#abb9d2",
                        "on-background": "#e4e2e4",
                        "surface-container-highest": "#353436",
                        "on-error": "#690005",
                        "on-primary-fixed": "#131b2e",
                        "outline-variant": "#45464d",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#e0e3e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "8px",
                        "dense-row": "24px",
                        "panel-gap": "2px",
                        "unit": "4px",
                        "container-padding": "16px"
                    },
                    "fontFamily": {
                        "label-xs": ["Inter"],
                        "heading-caps": ["Inter"],
                        "body-compact": ["Inter"],
                        "data-mono": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "label-xs": ["10px", { "lineHeight": "12px", "fontWeight": "600" }],
                        "heading-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-compact": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "data-mono": ["12px", { "lineHeight": "18px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .triage-pane { width: 320px; border-right: 1px solid theme('colors.outline-variant'); background-color: theme('colors.surface-container-low'); overflow-y: auto; }
        .remediation-desk { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .content-scroll { flex: 1; overflow-y: auto; padding: theme('spacing.container-padding'); }
        
        /* Custom scrollbar for dark tech theme */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: theme('colors.surface-container-lowest'); }
        ::-webkit-scrollbar-thumb { background: theme('colors.surface-variant'); border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: theme('colors.outline-variant'); }
        
        input, textarea, select {
            background-color: theme('colors.surface-container-highest');
            border: 1px solid theme('colors.outline-variant');
            color: theme('colors.on-surface');
            font-family: theme('fontFamily.data-mono');
            font-size: theme('fontSize.data-mono')[0];
            border-radius: theme('borderRadius.DEFAULT');
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 1px theme('colors.primary');
        }
        label {
            font-family: theme('fontFamily.label-xs');
            font-size: theme('fontSize.label-xs')[0];
            font-weight: theme('fontSize.label-xs')[1].fontWeight;
            color: theme('colors.on-surface-variant');
            text-transform: uppercase;
            margin-bottom: theme('spacing.unit');
            display: block;
        }
    </style>
</head>
<body>
<!-- SideNavBar (Suppressed as this is a focused task/entry form) -->
<!-- Main Workspace -->
<main class="w-full flex flex-col h-screen">
<!-- TopAppBar -->
<header class="bg-surface-container-high dark:bg-surface-container-high text-primary dark:text-primary font-heading-caps text-heading-caps docked full-width top-0 border-b border-outline-variant flat no shadows flex justify-between items-center px-gutter h-12 w-full z-10 shrink-0">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined hover:bg-surface-variant transition-colors p-1 cursor-pointer" data-icon="arrow_back">arrow_back</span>
<span class="font-heading-caps text-heading-caps text-on-surface-variant tracking-widest">ADA.OPS_REMEDIATION</span>
<span class="text-on-surface-variant mx-2">/</span>
<span class="text-on-surface">INTAKE_FORM_04A</span>
</div>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1 border-r border-outline-variant pr-2 mr-2">
<span class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant transition-colors p-1 cursor-pointer" data-icon="timer">timer</span>
<span class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant transition-colors p-1 cursor-pointer" data-icon="error_outline">error_outline</span>
<span class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant transition-colors p-1 cursor-pointer" data-icon="terminal">terminal</span>
</div>
<button class="border border-outline-variant text-on-surface font-label-xs text-label-xs px-3 py-1 hover:bg-surface-variant transition-colors mr-2">EXPORT_LOGS</button>
<button class="bg-primary-container text-primary border border-primary font-label-xs text-label-xs px-3 py-1 hover:bg-surface-variant transition-colors flex items-center gap-1">
                    COMMIT_REMEDIATION
                </button>
</div>
</header>
<!-- Layout Split -->
<div class="flex flex-1 overflow-hidden">
<!-- Main Intake Form (Remediation Desk) -->
<section class="remediation-desk content-scroll bg-surface">
<div class="max-w-3xl mx-auto w-full space-y-6">
<div class="border-b border-outline-variant pb-4 mb-6">
<h1 class="font-data-mono text-lg text-on-surface">Demand Letter Intake</h1>
<p class="font-body-compact text-body-compact text-on-surface-variant mt-1">Initialize new remediation target based on legal demand parameters.</p>
</div>
<!-- Target Definition -->
<div class="bg-surface-container-low border border-outline-variant p-4 space-y-4">
<h2 class="font-heading-caps text-heading-caps text-secondary tracking-widest border-b border-outline-variant pb-2">TARGET_DEFINITION</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label for="target_url">Target Site URL</label>
<input class="w-full p-2" id="target_url" placeholder="https://" type="text"/>
</div>
<div>
<label for="ecommerce_platform">E-commerce Platform</label>
<select class="w-full p-2" id="ecommerce_platform">
<option value="">SELECT_PLATFORM</option>
<option value="shopify">Shopify</option>
<option value="magento">Magento</option>
<option value="woocommerce">WooCommerce</option>
<option value="custom">Custom/Unknown</option>
</select>
</div>
</div>
<div>
<label for="priority_pages">Priority Revenue Pages (Comma separated paths)</label>
<input class="w-full p-2" id="priority_pages" placeholder="/checkout, /products/*, /cart" type="text"/>
</div>
</div>
<!-- Legal Allegations -->
<div class="bg-surface-container-low border border-outline-variant p-4 space-y-4">
<h2 class="font-heading-caps text-heading-caps text-error tracking-widest border-b border-outline-variant pb-2">LEGAL_ALLEGATIONS</h2>
<div>
<label for="allegation_text">Allegation Text (Raw Extract)</label>
<textarea class="w-full p-2 font-data-mono" id="allegation_text" placeholder="PASTE_RAW_DEMAND_TEXT_HERE" rows="6"></textarea>
</div>
</div>
<!-- Technical Context -->
<div class="bg-surface-container-low border border-outline-variant p-4 space-y-4">
<h2 class="font-heading-caps text-heading-caps text-secondary tracking-widest border-b border-outline-variant pb-2">TECHNICAL_CONTEXT</h2>
<div>
<label for="widget_details">Current Accessibility Widget/Scanner Details</label>
<textarea class="w-full p-2 font-data-mono" id="widget_details" placeholder="Identify any existing overlays or automated scanners currently active on target..." rows="3"></textarea>
</div>
</div>
</div>
</section>
<!-- Metadata Sidebar (Triage Pane variant) -->
<aside class="triage-pane p-4 flex flex-col gap-6">
<!-- Status & Deadlines -->
<div class="space-y-4">
<h3 class="font-heading-caps text-heading-caps text-secondary tracking-widest border-b border-outline-variant pb-2">METADATA</h3>
<div>
<label>Threat Level</label>
<div class="flex gap-2">
<button class="flex-1 bg-surface-container-high border border-outline-variant py-1 text-label-xs font-label-xs text-on-surface-variant hover:border-primary">LOW</button>
<button class="flex-1 bg-surface-container-high border border-outline-variant py-1 text-label-xs font-label-xs text-on-surface-variant hover:border-primary">MED</button>
<button class="flex-1 bg-error-container border border-error py-1 text-label-xs font-label-xs text-on-error-container">HIGH</button>
</div>
</div>
<div>
<label for="internal_deadline">Internal Deadline</label>
<input class="w-full p-2" id="internal_deadline" type="date"/>
</div>
<div>
<label for="legal_deadline">Legal Response Deadline</label>
<input class="w-full p-2" id="legal_deadline" type="date"/>
</div>
</div>
<!-- Developer Notes -->
<div class="flex-1 flex flex-col">
<h3 class="font-heading-caps text-heading-caps text-secondary tracking-widest border-b border-outline-variant pb-2 mb-4">DEV_NOTES</h3>
<textarea class="flex-1 w-full p-2 font-data-mono resize-none" placeholder="Initial technical observations..."></textarea>
</div>
</aside>
</div>
</main>
</body></html>
