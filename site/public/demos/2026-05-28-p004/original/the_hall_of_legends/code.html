<script>
        // Simple ambient entrance animation for the poster
        document.addEventListener('DOMContentLoaded', () => {
            const poster = document.querySelector('article');
            poster.style.opacity = '0';
            poster.style.transform = 'translateY(20px) rotate(-1deg)';
            
            setTimeout(() => {
                poster.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                poster.style.opacity = '1';
                poster.style.transform = 'translateY(0) rotate(-1deg)';
            }, 100);
        });
    </script>
