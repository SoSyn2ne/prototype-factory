<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalyst Calendar Triage</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="events-panel panel">
        <header class="panel-header">
          <div>
            <p class="panel-tag">2026-03-05-p001</p>
            <h1>Catalyst Calendar Triage</h1>
            <p class="panel-subtitle">Score upcoming catalysts by priority and promote high-conviction setups to your watchlist.</p>
          </div>
          <p class="clock" id="clock">--:--:--</p>
        </header>

        <div class="panel-toolbar">
          <label class="watch-filter">
            <input type="checkbox" id="watched-only" />
            <span>Watched only</span>
          </label>
          <p class="stats" id="stats">0 events</p>
        </div>

        <div id="event-groups" class="event-groups" aria-live="polite"></div>
      </section>

      <aside class="triage-panel panel">
        <h2>Triage Event</h2>
        <p class="panel-subtitle">Add an event and it will be ranked by Priority:</p>
        <p class="formula">
          <code>impact * confidence * (1 + (30 - horizon)/30 * 0.2)</code>
        </p>

        <form id="triage-form" class="triage-form">
          <label>
            Date
            <input type="date" id="event-date" name="event-date" required />
          </label>

          <label>
            Ticker
            <input type="text" id="event-ticker" name="event-ticker" maxlength="8" placeholder="NVDA" required />
          </label>

          <label>
            Category
            <select id="event-category" name="event-category" required>
              <option value="Earnings">Earnings</option>
              <option value="Product">Product</option>
              <option value="Macro">Macro</option>
              <option value="Regulatory">Regulatory</option>
              <option value="Other">Other</option>
            </select>
          </label>

          <label>
            Title
            <input type="text" id="event-title" name="event-title" maxlength="120" placeholder="Q1 FY26 earnings call" required />
          </label>

          <div class="field-grid">
            <label>
              Impact (1-5)
              <input type="number" id="event-impact" name="event-impact" min="1" max="5" value="3" required />
            </label>

            <label>
              Confidence (1-5)
              <input type="number" id="event-confidence" name="event-confidence" min="1" max="5" value="3" required />
            </label>
          </div>

          <label>
            Horizon (1-30 days)
            <input type="number" id="event-horizon" name="event-horizon" min="1" max="30" value="14" required />
          </label>

          <p class="preview" id="priority-preview">Priority preview: 9.96</p>
          <button type="submit">Add Event</button>
        </form>
      </aside>
    </main>
    <script src="./assets/app.js" defer></script>
  </body>
</html>
