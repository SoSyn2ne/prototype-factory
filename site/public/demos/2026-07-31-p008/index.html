<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KR 알바/단톡방 사기 패턴 Sniffer - Form Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="split">
      <section class="brand">
        <p class="id">2026-07-31-p008</p>
        <h1>KR 알바/단톡방 사기 패턴 Sniffer</h1>
        <p>카톡/텔레그램 단톡방 &#39;알바&#39; 메시지 1개를 paste 하면 사기 패턴 점수 1~100 + 6-category radar + 1분 행동 3개 + 4종 신고(112/1332/스팸/KISA) + 안전 정통 알바 채널을 한 화면에서 뽑아주는 KR 사용자 방어 도구.</p>
      </section>
      <section class="card-wrap">
        <form class="card" aria-label="Intake form">
          <h2>Project intake</h2>
          <label>
            Prototype goal
            <input type="text" placeholder="What should this prototype prove?" />
          </label>
          <label>
            Primary persona
            <input type="text" placeholder="Who is this for?" />
          </label>
          <label>
            Constraints
            <textarea id="constraints" rows="4" placeholder="Time, budget, technical limits..."></textarea>
          </label>
          <div class="foot">
            <span id="counter">0 / 280</span>
            <button type="button">Submit draft</button>
          </div>
        </form>
      </section>
    </main>
    <script src="./assets/app.js" defer></script>
  </body>
</html>
