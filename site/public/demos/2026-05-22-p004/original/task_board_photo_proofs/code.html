<span class="material-symbols-outlined mb-1" data-icon="analytics">analytics</span>

<script>
        // Simple micro-interaction for checklist items
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const label = this.closest('label');
                const text = label.querySelector('.flex-grow p:first-child');
                
                if(this.checked) {
                    text.classList.add('line-through', 'text-outline');
                    text.classList.remove('text-on-surface', 'font-medium');
                    label.classList.remove('bg-inverse-on-surface');
                } else {
                    text.classList.remove('line-through', 'text-outline');
                    text.classList.add('text-on-surface', 'font-medium');
                    // In a real app, logic would determine if it needs background highlight based on 'next up' status
                }
            });
        });
    </script>
