<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No-Show Deposit Notice Kit - Form Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="split">
      <section class="brand">
        <p class="id">2026-06-29-p003</p>
        <h1>No-Show Deposit Notice Kit</h1>
        <p>Small restaurants convert phone reservations into legal deposit notices, reminder proof, and privacy-safe no-show recovery.</p>
      </section>
      <section class="card-wrap">
        <form class="card" aria-label="Intake form">
          <h2>Project intake</h2>
          <label>
            Prototype goal
            <input type="text" placeholder="What should this prototype prove?" />
          </label>
          <label>
            Primary persona
            <input type="text" placeholder="Who is this for?" />
          </label>
          <label>
            Constraints
            <textarea id="constraints" rows="4" placeholder="Time, budget, technical limits..."></textarea>
          </label>
          <div class="foot">
            <span id="counter">0 / 280</span>
            <button type="button">Submit draft</button>
          </div>
        </form>
      </section>
    </main>
    <script src="./assets/app.js" defer></script>
  </body>
</html>
