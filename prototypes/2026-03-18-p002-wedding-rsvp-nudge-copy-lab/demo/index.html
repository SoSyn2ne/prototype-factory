<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding RSVP Nudge Copy Lab — Demo</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div>
          <div class="id">2026-03-18-p002</div>
          <h1>Wedding RSVP Nudge Copy Lab</h1>
          <p class="sub">Tone-controlled follow-up messages: polite / playful / direct.</p>
        </div>
        <button class="btn" id="seedBtn" type="button">Randomize tone seed</button>
      </header>

      <section class="grid">
        <section class="card">
          <h2>Inputs</h2>

          <div class="fields">
            <label class="field">
              <span>Recipient group</span>
              <select id="group">
                <option value="family">Family</option>
                <option value="friends" selected>Friends</option>
                <option value="coworkers">Coworkers</option>
              </select>
            </label>

            <label class="field">
              <span>Channel</span>
              <select id="channel">
                <option value="kakao" selected>Kakao</option>
                <option value="sms">SMS</option>
                <option value="email">Email</option>
              </select>
            </label>

            <label class="field">
              <span>Closeness</span>
              <input id="close" type="range" min="0" max="100" value="70" />
              <div class="row"><span class="muted">formal</span><span class="pill" id="closeOut"></span><span class="muted">close</span></div>
            </label>

            <label class="field">
              <span>Urgency</span>
              <input id="urg" type="range" min="0" max="100" value="55" />
              <div class="row"><span class="muted">no rush</span><span class="pill" id="urgOut"></span><span class="muted">need now</span></div>
            </label>

            <label class="field">
              <span>Event date</span>
              <input id="date" type="date" />
            </label>

            <label class="field">
              <span>Notes (optional)</span>
              <textarea id="notes" rows="4" placeholder="e.g., ‘RSVP link is in the invite’, ‘meal choice needed’, ‘we saved you a seat’..."></textarea>
            </label>
          </div>

          <div class="small muted" id="seedOut">seed: —</div>
        </section>

        <section class="card">
          <div class="row-between">
            <h2>Variants</h2>
            <div class="small muted">Click Copy → paste into chat</div>
          </div>

          <div class="variants" id="variants"></div>

          <div class="toast" id="toast" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <script src="./assets/app.js"></script>
  </body>
</html>
