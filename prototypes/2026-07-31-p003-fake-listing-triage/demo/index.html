<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KR 허위매물 Quick-Triage + 신고 패킷 - Form Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="split">
      <section class="brand">
        <p class="id">2026-07-31-p003</p>
        <h1>KR 허위매물 Quick-Triage + 신고 패킷</h1>
        <p>한국 부동산 앱 매물 URL/주소/가격 1개를 입력하면 허위 가능성 점수 1~100 + 5-category radar + 4종 신고 패킷(국토부/LH_SHOP/분쟁조정/경찰) + 안전 매물 3개를 한 화면에서 뽑아주는 매수/임차 triage 도구.</p>
      </section>
      <section class="card-wrap">
        <form class="card" aria-label="Intake form">
          <h2>Project intake</h2>
          <label>
            Prototype goal
            <input type="text" placeholder="What should this prototype prove?" />
          </label>
          <label>
            Primary persona
            <input type="text" placeholder="Who is this for?" />
          </label>
          <label>
            Constraints
            <textarea id="constraints" rows="4" placeholder="Time, budget, technical limits..."></textarea>
          </label>
          <div class="foot">
            <span id="counter">0 / 280</span>
            <button type="button">Submit draft</button>
          </div>
        </form>
      </section>
    </main>
    <script src="./assets/app.js" defer></script>
  </body>
</html>
