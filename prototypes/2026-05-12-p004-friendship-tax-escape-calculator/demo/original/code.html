<style>

<body class="bg-surface text-on-surface min-h-screen overflow-x-hidden pt-24 pb-32">
<div class="noise-overlay"></div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center bg-surface/90 backdrop-blur-sm w-full top-0 px-gutter py-4 border-b-4 border-on-surface shadow-[4px_4px_0px_0px_rgba(26,28,28,1)] bg-surface text-primary">
<div class="flex items-center gap-4">
<h1 class="font-receipt-header text-receipt-header uppercase text-on-surface">Debt Confessional</h1>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:rotate-1 hover:bg-primary-container transition-transform active:scale-95 duration-75 p-2 rounded">
<span class="material-symbols-outlined">history_edu</span>
</button>
<button class="text-on-surface-variant hover:rotate-1 hover:bg-primary-container transition-transform active:scale-95 duration-75 p-2 rounded">
<span class="material-symbols-outlined">receipt_long</span>
</button>
<div class="w-8 h-8 bg-surface-variant border-2 border-on-surface rounded-full overflow-hidden shadow-[2px_2px_0px_0px_rgba(26,28,28,1)] transform rotate-2">
<img alt="Torn scrap of paper with user silhouette" class="w-full h-full object-cover" data-alt="A small profile picture styled as a torn scrap of paper featuring a silhouette of a user. The image has a rough, textured appearance reminiscent of a scrapbook element. The lighting is flat, emphasizing the 2D nature of the paper snippet. The overall aesthetic fits a gritty, physical document style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3j4_JsQ2DgIDQXJlKY9Dx7K_MC7jzanThecCijx05aMrXLkHLArGV0p7Pv8hcSbJUt-Un1_P5FT6WBRlsdQDpq6Fll-7oDL-FRCFatIsQwxSUu1LC44LnfkoNqKpZR3RN6lP3qcmoXa20UzfZnAZkdRG5ZhiA7cYySe8saxeDnyXE1P_mGVJgNjEBBjg7nNZvYB2KkV4E9R-bQgVWCRCARgfEu8mkkZG6mOMx4C2IzOnImMtm5_b-gUqpXIurYKReMksuQNhZNLx8"/>
</div>
</div>
</header>
<main class="max-w-4xl mx-auto px-gutter relative z-10">
<div class="mb-margin text-center">
<h2 class="font-receipt-header text-receipt-header text-on-background mb-unit bg-primary-container inline-block px-4 py-1 transform -rotate-1 shadow-[2px_2px_0px_0px_rgba(26,28,28,1)]">The Paper Trail:</h2>
<p class="font-emotional-note text-emotional-note text-on-surface-variant transform rotate-1 inline-block bg-tertiary-container px-3 py-1 shadow-[2px_2px_0px_0px_rgba(26,28,28,1)] mt-2">What are we paying for now?</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-12 gap-margin relative">
<!-- Main Intake Form (Receipt Card) -->
<div class="md:col-span-8 bg-surface-container-lowest border-2 border-on-surface shadow-[4px_4px_0px_0px_rgba(26,28,28,1)] p-margin relative transform rotate-[-0.5deg] z-20">
<div class="absolute top-0 left-0 w-full h-2 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMCIgaGVpZ2h0PSIxMCI+PHBhdGggZD0iTTAgMTBMNSAwTDEwIDEwWiIgZmlsbD0iI2Y5ZjlmOSIvPjwvc3ZnPg==')] -mt-2"></div>
<h3 class="font-receipt-header text-receipt-header text-on-surface mb-margin wobbly-line pb-2">New Obligation</h3>
<form class="space-y-margin">
<!-- Title Input -->
<div class="relative transform rotate-[0.5deg]">
<label class="block font-label-mono text-label-mono text-on-surface-variant mb-unit">Event / Debt Name</label>
<input class="w-full bg-transparent border-0 border-b-2 border-on-surface border-dashed font-receipt-body text-receipt-body text-on-surface p-2 highlight-input focus:ring-0 transition-colors" placeholder="e.g., Sarah's Bachelorette" type="text"/>
</div>
<!-- Category Tokens -->
<div class="relative transform rotate-[-1deg] translate-x-stack-offset">
<label class="block font-label-mono text-label-mono text-on-surface-variant mb-unit">Obligation Type</label>
<div class="flex flex-wrap gap-unit">
<button class="bg-surface-variant border-2 border-on-surface font-label-mono text-label-mono text-on-surface px-3 py-1 shadow-[2px_2px_0px_0px_rgba(26,28,28,1)] hover:bg-secondary-container transition-colors transform rotate-1" type="button">Wedding</button>
<button class="bg-primary-container border-2 border-on-surface font-label-mono text-label-mono text-on-primary-fixed px-3 py-1 shadow-[2px_2px_0px_0px_rgba(26,28,28,1)] hover:bg-primary transition-colors transform -rotate-2" type="button">Trip</button>
<button class="bg-surface-variant border-2 border-on-surface font-label-mono text-label-mono text-on-surface px-3 py-1 shadow-[2px_2px_0px_0px_rgba(26,28,28,1)] hover:bg-secondary-container transition-colors transform rotate-[1.5deg]" type="button">Dinner</button>
<button class="bg-surface-variant border-2 border-on-surface font-label-mono text-label-mono text-on-surface px-3 py-1 shadow-[2px_2px_0px_0px_rgba(26,28,28,1)] hover:bg-secondary-container transition-colors transform -rotate-[0.5deg]" type="button">Favor</button>
</div>
</div>
<!-- Role Tokens (Sticky Note Style) -->
<div class="relative mt-margin transform rotate-[1deg] -translate-x-stack-offset bg-tertiary-container border-2 border-on-surface p-4 shadow-[4px_4px_0px_0px_rgba(26,28,28,1)]">
<div class="absolute top-0 left-1/2 transform -translate-x-1/2 -mt-3 w-16 h-6 bg-primary-container opacity-80 rotate-[-3deg] mix-blend-multiply"></div>
<label class="block font-emotional-note text-emotional-note text-on-tertiary-container mb-2">My Role (The Damage)</label>
<div class="flex flex-wrap gap-2">
<label class="inline-flex items-center">
<input class="form-radio text-tertiary focus:ring-tertiary bg-surface border-on-surface h-4 w-4" name="role" type="radio"/>
<span class="ml-2 font-receipt-body text-receipt-body text-on-tertiary-container">Bridesmaid</span>
</label>
<label class="inline-flex items-center">
<input class="form-radio text-tertiary focus:ring-tertiary bg-surface border-on-surface h-4 w-4" name="role" type="radio"/>
<span class="ml-2 font-receipt-body text-receipt-body text-on-tertiary-container">Groomsman</span>
</label>
<label class="inline-flex items-center">
<input checked="" class="form-radio text-tertiary focus:ring-tertiary bg-surface border-on-surface h-4 w-4" name="role" type="radio"/>
<span class="ml-2 font-receipt-body text-receipt-body text-on-tertiary-container bg-primary-container px-1">Guest</span>
</label>
</div>
</div>
<!-- Cost Estimate -->
<div class="relative transform -rotate-[0.5deg]">
<label class="block font-label-mono text-label-mono text-on-surface-variant mb-unit">Estimated Cost ($)</label>
<div class="flex items-center border-2 border-on-surface bg-surface-bright shadow-[2px_2px_0px_0px_rgba(26,28,28,1)]">
<span class="font-receipt-header text-receipt-header text-on-surface-variant pl-4 py-2">$</span>
<input class="w-full bg-transparent border-0 font-receipt-header text-receipt-header text-error p-2 focus:ring-0 focus:bg-error-container transition-colors" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Submit Button (Void Stamp Style) -->
<div class="pt-margin text-right">
<button class="inline-flex items-center justify-center gap-2 border-4 border-on-surface bg-surface-container-highest px-6 py-3 font-receipt-header text-receipt-header uppercase text-on-surface hover:bg-error hover:text-on-error hover:border-error transition-all transform rotate-[-2deg] active:scale-95 shadow-[4px_4px_0px_0px_rgba(26,28,28,1)]" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">archive</span>
                            File It
                        </button>
</div>
</form>
<div class="absolute bottom-0 left-0 w-full h-2 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMCIgaGVpZ2h0PSIxMCI+PHBhdGggZD0iTTAgMEw1IDEwTDEwIDBaIiBmaWxsPSIjZjlmOWY5Ii8+PC9zdmc+')] -mb-2"></div>
</div>
<!-- Side Context (Scrapbook Elements) -->
<div class="md:col-span-4 space-y-margin relative z-10">
<!-- Guilt Meter -->
<div class="bg-surface-container border-2 border-on-surface p-4 shadow-[4px_4px_0px_0px_rgba(26,28,28,1)] transform rotate-[2deg] translate-y-stack-offset">
<h4 class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest mb-4 border-b-2 border-on-surface border-dashed pb-1">Current Social Debt Level</h4>
<div class="relative h-8 bg-surface border-2 border-on-surface mb-2">
<div class="absolute top-0 left-0 h-full bg-error-container w-3/4 border-r-2 border-on-surface"></div>
<div class="absolute top-1/2 -translate-y-1/2 left-[75%] -translate-x-1/2 bg-surface border-2 border-on-surface rounded-full p-1 shadow-[2px_2px_0px_0px_rgba(26,28,28,1)] transform rotate-[-10deg]">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">sick</span>
</div>
</div>
<p class="font-fine-print text-fine-print text-right text-on-surface-variant">Approaching Maximum Capacity</p>
</div>
<!-- Recent Logs snippet -->
<div class="bg-surface-bright border-2 border-on-surface p-4 shadow-[4px_4px_0px_0px_rgba(26,28,28,1)] transform -rotate-[1deg] translate-x-stack-offset relative">
<div class="absolute -left-2 top-4 w-4 h-8 bg-secondary-container opacity-80 mix-blend-multiply"></div>
<h4 class="font-receipt-body text-receipt-body text-on-surface font-bold mb-2">Recent Logs:</h4>
<ul class="space-y-2 font-fine-print text-fine-print text-on-surface-variant">
<li class="flex justify-between items-center wobbly-line pb-1">
<span>Dave's Bach</span>
<span class="text-error font-bold">-$850</span>
</li>
<li class="flex justify-between items-center wobbly-line pb-1">
<span>Baby Shower Gift</span>
<span class="text-error font-bold">-$120</span>
</li>
</ul>
</div>
</div>
</div>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-surface-container-highest border-t-2 border-on-surface/10 shadow-[0px_-4px_0px_0px_rgba(57,95,148,0.2)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-secondary-container hover:text-on-secondary-container transition-all active:translate-y-1 duration-100">
<span class="material-symbols-outlined mb-1">account_balance_wallet</span>
<span class="font-label-mono text-label-mono">Audit</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 rotate-[-1deg] shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:bg-secondary-container hover:text-on-secondary-container transition-all active:translate-y-1 duration-100">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">receipt</span>
<span class="font-label-mono text-label-mono">Debts</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-secondary-container hover:text-on-secondary-container transition-all active:translate-y-1 duration-100">
<span class="material-symbols-outlined mb-1">diversity_1</span>
<span class="font-label-mono text-label-mono">Social</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-secondary-container hover:text-on-secondary-container transition-all active:translate-y-1 duration-100">
<span class="material-symbols-outlined mb-1">delete_forever</span>
<span class="font-label-mono text-label-mono">The Void</span>
</button>
</nav>
