<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Debt Confessional - The Confession</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Space+Mono:wght@400;700&amp;family=Syne:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed-variant": "#613d3e",
                      "tertiary-container": "#ffdcdc",
                      "surface-tint": "#6a5f00",
                      "on-tertiary-fixed": "#2f1314",
                      "error": "#ba1a1a",
                      "on-background": "#1a1c1c",
                      "primary-fixed-dim": "#dec800",
                      "on-secondary-fixed-variant": "#1e477b",
                      "on-secondary": "#ffffff",
                      "surface-bright": "#f9f9f9",
                      "on-tertiary-container": "#835b5c",
                      "inverse-surface": "#2f3131",
                      "on-surface-variant": "#4b4731",
                      "on-primary-container": "#726600",
                      "secondary": "#395f94",
                      "surface": "#f9f9f9",
                      "primary-fixed": "#fde400",
                      "error-container": "#ffdad6",
                      "inverse-on-surface": "#f1f1f1",
                      "outline": "#7c775f",
                      "primary-container": "#ffe600",
                      "tertiary-fixed-dim": "#ecbaba",
                      "surface-container-high": "#e8e8e8",
                      "on-surface": "#1a1c1c",
                      "surface-container-highest": "#e2e2e2",
                      "tertiary": "#7b5455",
                      "on-primary-fixed": "#201c00",
                      "primary": "#6a5f00",
                      "on-primary": "#ffffff",
                      "on-error": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "background": "#f9f9f9",
                      "inverse-primary": "#dec800",
                      "on-tertiary": "#ffffff",
                      "on-error-container": "#93000a",
                      "on-primary-fixed-variant": "#504700",
                      "surface-container": "#eeeeee",
                      "surface-container-low": "#f3f3f3",
                      "surface-dim": "#dadada",
                      "tertiary-fixed": "#ffdad9",
                      "outline-variant": "#cdc7aa",
                      "secondary-fixed-dim": "#a7c8ff",
                      "surface-variant": "#e2e2e2",
                      "on-secondary-container": "#284f83",
                      "secondary-fixed": "#d5e3ff",
                      "secondary-container": "#9ec2fe",
                      "on-secondary-fixed": "#001c3b"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "unit": "4px",
                      "stack-offset": "8px",
                      "margin": "24px"
              },
              "fontFamily": {
                      "fine-print": [
                              "JetBrains Mono"
                      ],
                      "emotional-note": [
                              "Syne"
                      ],
                      "label-mono": [
                              "JetBrains Mono"
                      ],
                      "receipt-header": [
                              "Space Mono"
                      ],
                      "receipt-body": [
                              "JetBrains Mono"
                      ]
              },
              "fontSize": {
                      "fine-print": [
                              "10px",
                              {
                                      "lineHeight": "12px",
                                      "fontWeight": "400"
                              }
                      ],
                      "emotional-note": [
                              "18px",
                              {
                                      "lineHeight": "22px",
                                      "letterSpacing": "0.5px",
                                      "fontWeight": "600"
                              }
                      ],
                      "label-mono": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "fontWeight": "700"
                              }
                      ],
                      "receipt-header": [
                              "28px",
                              {
                                      "lineHeight": "32px",
                                      "letterSpacing": "-1px",
                                      "fontWeight": "700"
                              }
                      ],
                      "receipt-body": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ]
              }
            },
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom texture for receipt background */
        .receipt-texture {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        }
        .wobbly-border {
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .zigzag-bottom {
            background: linear-gradient(-45deg, transparent 16px, #f9f9f9 0), linear-gradient(45deg, transparent 16px, #f9f9f9 0);
            background-repeat: repeat-x;
            background-position: left bottom;
            background-size: 22px 32px;
            padding-bottom: 24px;
        }
    </style>
</head>
<body class="bg-surface-dim min-h-screen text-on-surface font-receipt-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center bg-surface/90 backdrop-blur-sm border-b-4 border-on-surface shadow-[4px_4px_0px_0px_rgba(26,28,28,1)] px-gutter py-4">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high border-2 border-on-surface overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 20px;">face</span>
</div>
<h1 class="font-receipt-header text-receipt-header uppercase text-on-surface">Debt Confessional</h1>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface hover:rotate-1 hover:bg-primary-container transition-transform active:scale-95 duration-75 p-1">
<span class="material-symbols-outlined" data-icon="history_edu">history_edu</span>
</button>
<button class="text-on-surface hover:rotate-1 hover:bg-primary-container transition-transform active:scale-95 duration-75 p-1">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
</button>
</div>
</header>
<!-- Main Canvas (Nav Suppressed for Focus) -->
<main class="pt-[100px] pb-24 min-h-screen flex flex-col items-center justify-center px-gutter relative overflow-hidden">
<!-- Background Chaos Elements -->
<div class="absolute top-1/4 left-[-20px] w-48 h-12 bg-primary-container opacity-20 rotate-[-15deg] blur-md pointer-events-none"></div>
<div class="absolute bottom-1/4 right-[-40px] w-64 h-64 rounded-full bg-secondary-container opacity-10 blur-xl pointer-events-none"></div>
<!-- The Share Card (Receipt Collage) -->
<div class="relative w-full max-w-sm flex flex-col items-center group">
<!-- Washi Tape Pin (Top Left) -->
<div class="absolute -top-4 -left-6 w-24 h-8 bg-primary-container opacity-90 rotate-[-8deg] shadow-[2px_2px_0px_0px_#1a1c1c] z-10 flex items-center justify-center">
<span class="font-fine-print text-fine-print text-on-primary-container uppercase opacity-50 tracking-widest">FRAGILE</span>
</div>
<!-- Main Receipt Body -->
<div class="bg-surface border-4 border-on-surface shadow-[8px_8px_0px_0px_#1a1c1c] w-full p-margin rotate-[1deg] flex flex-col gap-6 relative receipt-texture zigzag-bottom transition-transform duration-300 hover:rotate-0">
<!-- Internal Washi Tape (Top Right) -->
<div class="absolute top-2 right-[-10px] w-16 h-4 bg-tertiary-container opacity-80 rotate-[12deg] z-10"></div>
<!-- Header Section -->
<div class="text-center flex flex-col items-center border-b-2 border-dashed border-outline-variant pb-4">
<span class="material-symbols-outlined text-[32px] mb-2" data-weight="fill" style="font-variation-settings: 'FILL' 1;">favorite</span>
<h2 class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest">Official Audit Result</h2>
<p class="font-fine-print text-fine-print text-outline mt-1">TXN: #SOCIAL-992A</p>
</div>
<!-- The Statement (Highlighter Input Style) -->
<div class="flex flex-col gap-2 relative">
<h3 class="font-emotional-note text-emotional-note text-on-surface">
                        I love you 3000,
                    </h3>
<div class="relative inline-block w-fit mt-1">
<!-- Thick Highlighter Background -->
<div class="absolute inset-0 bg-primary-container scale-110 -rotate-1 z-0 origin-left"></div>
<h3 class="font-receipt-header text-receipt-header text-on-surface relative z-10 uppercase whitespace-nowrap">
                            But I Have $300.
                        </h3>
</div>
</div>
<!-- Obligation Tokens -->
<div class="flex flex-wrap gap-2 mt-2">
<span class="font-label-mono text-label-mono bg-surface-container-high px-2 py-1 border border-outline border-dashed rotate-[-2deg]">#BudgetBoundaries</span>
<span class="font-label-mono text-label-mono bg-error-container text-on-error-container px-2 py-1 border-2 border-error wobbly-border rotate-[3deg]">Declined Event</span>
</div>
<!-- Fine Print Details -->
<div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t-2 border-dashed border-outline-variant font-fine-print text-fine-print text-on-surface-variant uppercase">
<div class="flex flex-col">
<span class="text-outline">Calculated Guilt:</span>
<span class="text-on-surface font-bold">Overwhelming</span>
</div>
<div class="flex flex-col text-right">
<span class="text-outline">Financial Reality:</span>
<span class="text-error font-bold">Unavoidable</span>
</div>
</div>
<!-- Barcode Placeholder -->
<div class="mt-4 flex justify-center w-full h-12 overflow-hidden opacity-50">
<div class="w-full bg-[linear-gradient(90deg,#1a1c1c_1px,transparent_1px,#1a1c1c_3px,transparent_3px,#1a1c1c_5px,transparent_5px,#1a1c1c_8px,transparent_8px,#1a1c1c_12px,transparent_12px)] bg-[length:14px_100%] h-full"></div>
</div>
</div>
<!-- Washi Tape Pin (Bottom Right) -->
<div class="absolute -bottom-6 -right-4 w-20 h-6 bg-secondary-container opacity-80 rotate-[15deg] shadow-[2px_2px_0px_0px_#1a1c1c] z-10"></div>
</div>
<!-- Postage Stamp Share Button -->
<button class="mt-16 bg-surface border-4 border-on-surface text-on-surface font-receipt-header text-[20px] leading-none uppercase px-8 py-5 shadow-[6px_6px_0px_0px_#ba1a1a] hover:translate-y-1 hover:shadow-[2px_2px_0px_0px_#ba1a1a] transition-all relative group flex items-center gap-3 rotate-[-2deg] active:scale-95 duration-75">
<!-- Jagged Edge Pseudo-effect via borders inside -->
<div class="absolute inset-0 border-2 border-dashed border-surface-container m-1 pointer-events-none"></div>
<span class="material-symbols-outlined text-[24px] group-hover:rotate-12 transition-transform" data-icon="send">send</span>
            Share Confession
        </button>
</main>
</body></html>
