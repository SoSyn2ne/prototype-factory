<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revenue Early-Warning Score Demo</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="id">2026-02-20-p001</p>
        <h1>Revenue Early-Warning Score</h1>
        <p>
          One daily tripwire that turns noisy monetization signals into a score,
          a color band, and immediate next actions.
        </p>
      </header>

      <section class="grid">
        <section class="card score-card">
          <h2>Daily Score</h2>
          <p class="score" id="score-value">78</p>
          <p id="score-band" class="band green">Green band: stable</p>
          <div class="meter" aria-hidden="true">
            <span id="meter-fill"></span>
          </div>
          <button id="simulate-dip" type="button">Simulate bad day</button>
        </section>

        <section class="card controls">
          <h2>Driver Inputs vs 7-day baseline</h2>

          <label>
            MRR delta (%)
            <input data-metric="mrr" type="range" min="-30" max="30" value="4" />
            <strong id="mrr-val">+4%</strong>
          </label>

          <label>
            Conversion delta (%)
            <input data-metric="conversion" type="range" min="-30" max="30" value="3" />
            <strong id="conversion-val">+3%</strong>
          </label>

          <label>
            Refund rate delta (%)
            <input data-metric="refund" type="range" min="-30" max="30" value="-6" />
            <strong id="refund-val">-6%</strong>
          </label>

          <label>
            CAC delta (%)
            <input data-metric="cac" type="range" min="-30" max="30" value="1" />
            <strong id="cac-val">+1%</strong>
          </label>

          <label>
            Activation delta (%)
            <input data-metric="activation" type="range" min="-30" max="30" value="2" />
            <strong id="activation-val">+2%</strong>
          </label>
        </section>

        <section class="card actions">
          <h2>Suggested Next Actions (15 minutes)</h2>
          <ul id="actions-list"></ul>
        </section>
      </section>
    </main>

    <script src="./assets/app.js" defer></script>
  </body>
</html>
