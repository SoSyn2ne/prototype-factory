<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earnings Language Drift Radar Demo</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="id">2026-02-26-p001</p>
        <h1>Earnings Language Drift Radar</h1>
        <p>
          Paste earnings-call text and highlight demand/risk/supply drift terms
          with live category counts.
        </p>
      </header>

      <section class="layout">
        <article class="panel input-panel">
          <h2>Transcript Input</h2>
          <textarea id="transcript" rows="12" placeholder="Paste a section of earnings-call remarks..."></textarea>
          <button id="analyze" type="button">Analyze Language Drift</button>

          <div class="counts" aria-live="polite">
            <span class="count demand">Demand: <strong id="count-demand">0</strong></span>
            <span class="count risk">Risk: <strong id="count-risk">0</strong></span>
            <span class="count supply">Supply: <strong id="count-supply">0</strong></span>
          </div>
        </article>

        <article class="panel output-panel">
          <h2>Highlighted Output</h2>
          <div id="output" class="output">No analysis yet.</div>
          <p class="legend">
            <span class="dot demand"></span> demand terms
            <span class="dot risk"></span> risk terms
            <span class="dot supply"></span> supply terms
          </p>
        </article>
      </section>
    </main>

    <script src="./assets/app.js" defer></script>
  </body>
</html>
