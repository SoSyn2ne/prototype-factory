<script>
        // Simple JS to bind sliders to the active sticker visually
        const sticker = document.getElementById('active-sticker');
        const scaleSlider = document.getElementById('scale-slider');
        const rotateSlider = document.getElementById('rotate-slider');
        const tintSlider = document.getElementById('tint-slider');

        function updateSticker() {
            if(!sticker) return;
            const scale = scaleSlider.value / 100;
            const rotate = rotateSlider.value;
            // The hue-rotate is applied to an inner element if needed, but for now apply transform to the container
            sticker.style.transform = `translate(-50%, -50%) scale(${scale}) rotate(${rotate}deg)`;
            
            // Simple tint effect using filter
            const stickerContent = sticker.querySelector('.w-full.h-full.bg-secondary-container');
            if(stickerContent) {
                stickerContent.style.filter = `hue-rotate(${tintSlider.value}deg)`;
            }
        }

        if(scaleSlider) scaleSlider.addEventListener('input', updateSticker);
        if(rotateSlider) rotateSlider.addEventListener('input', updateSticker);
        if(tintSlider) tintSlider.addEventListener('input', updateSticker);
    </script>
