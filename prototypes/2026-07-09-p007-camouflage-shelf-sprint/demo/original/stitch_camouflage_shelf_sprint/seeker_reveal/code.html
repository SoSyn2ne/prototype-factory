<style>
        .vibrate-1 { animation: vibrate-1 0.3s linear infinite both; }
        @keyframes vibrate-1 {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: theme('colors.primary-fixed');
            box-shadow: 0 0 20px theme('colors.primary-fixed'), 0 0 40px theme('colors.primary-fixed');
            animation: scan 3s ease-in-out infinite alternate;
            z-index: 50;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0.8; }
            50% { opacity: 1; height: 8px; }
            100% { top: 100%; opacity: 0.8; }
        }
        .shake-intense { animation: shake-intense 0.1s cubic-bezier(.36,.07,.19,.97) infinite; }
        @keyframes shake-intense {
            0% { transform: translate(0, 0) rotate(0deg); }
