<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tech Value Receipt - Field Note Capture</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        /* High-contrast form elements */
        input[type="text"], input[type="file"], textarea, select {
            border-width: 1px;
            border-color: #c6c6cd; /* outline-variant */
            background-color: #ffffff;
            transition: all 0.2s ease-in-out;
        }
        input[type="text"]:focus, input[type="file"]:focus, textarea:focus, select:focus {
            border-width: 2px;
            border-color: #0b1c30; /* on-background */
            outline: none;
            box-shadow: none;
        }
        
        /* Custom toggle switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #000000; /* primary */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #000000; /* primary */
        }
    </style>

                      "error-container": "#ffdad6",
                      "surface-tint": "#565e74",
                      "on-tertiary": "#ffffff",

                      "tertiary-container": "#0d1c2f",
                      "surface-variant": "#d3e4fe",

                      "on-secondary": "#ffffff",

                      "on-surface-variant": "#45464d",

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col md:hidden">
<!-- Top Navigation Area (Transactional/Task-focused, simplified TopNavBar) -->
<header class="bg-surface border-b-2 border-outline-variant flex justify-between items-center w-full px-margin-mobile h-[64px] sticky top-0 z-40">
<div class="flex items-center gap-2">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container rounded-DEFAULT transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">New Capture</h1>
</div>
<button aria-label="Cancel" class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container rounded-DEFAULT transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-6 overflow-y-auto pb-32">
<form class="space-y-6">
<!-- Context Header -->
<div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-DEFAULT flex items-center gap-4">
<div class="w-12 h-12 bg-secondary-container rounded-DEFAULT flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-secondary" style="font-variation-settings: 'FILL' 1;">my_location</span>
</div>
<div>
<h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider">Current Location</h2>
<p class="font-headline-md text-headline-md text-primary mt-1">Site Alpha-7</p>
<p class="font-data-mono text-data-mono text-on-surface-variant mt-1">LAT: 34.0522 N, LON: 118.2437 W</p>
</div>
</div>
<!-- Service Type Selection -->
<section class="space-y-2">
<label class="block font-label-bold text-label-bold text-on-surface uppercase tracking-wider" for="service-type">Service Type</label>
<div class="relative">
<select class="w-full h-touch-target px-4 appearance-none rounded-DEFAULT font-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest" id="service-type">
<option disabled="" selected="" value="">Select operation type...</option>
<option value="inspection">Routine Inspection</option>
<option value="repair">Emergency Repair</option>
<option value="upgrade">System Upgrade</option>
<option value="audit">Compliance Audit</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_drop_down</span>
</div>
</div>
</section>
<!-- Value Proof Toggles (Bento-ish layout for high contrast tap areas) -->
<section class="space-y-3">
<div class="flex items-center justify-between">
<label class="block font-label-bold text-label-bold text-on-surface uppercase tracking-wider">Value Proof Markers</label>
<span class="font-label-md text-label-md text-on-surface-variant">Select all applicable</span>
</div>
<div class="grid grid-cols-1 gap-3">
<!-- Toggle 1 -->
<label class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant p-4 rounded-DEFAULT cursor-pointer hover:bg-surface-container-low transition-colors min-h-[56px]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-error">warning</span>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Downtime Prevented</span>
</div>
<div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-outline-variant appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer transition-colors duration-200 ease-in-out"></label>
</div>
</label>
<!-- Toggle 2 -->
<label class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant p-4 rounded-DEFAULT cursor-pointer hover:bg-surface-container-low transition-colors min-h-[56px]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-container">health_and_safety</span>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Safety Hazard Cleared</span>
</div>
<div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-outline-variant appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer transition-colors duration-200 ease-in-out"></label>
</div>
</label>
<!-- Toggle 3 -->
<label class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant p-4 rounded-DEFAULT cursor-pointer hover:bg-surface-container-low transition-colors min-h-[56px]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#059669]">savings</span>
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Cost Savings Identified</span>
</div>
<div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-outline-variant appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer transition-colors duration-200 ease-in-out"></label>
</div>
</label>
</div>
</section>
<!-- Media & Notes Upload Area -->
<section class="space-y-3">
<label class="block font-label-bold text-label-bold text-on-surface uppercase tracking-wider">Field Evidence &amp; Notes</label>
<!-- Photo Upload Box -->
<button class="w-full bg-surface-container-low border-2 border-dashed border-outline-variant rounded-DEFAULT flex flex-col items-center justify-center py-8 gap-2 hover:bg-surface-container hover:border-outline transition-colors group" type="button">
<div class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[32px]">add_a_photo</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Tap to add photo</span>
<span class="font-label-md text-label-md text-on-surface-variant">High-res required for audit</span>
</button>
<!-- Voice-to-Text Notes Area -->
<div class="relative">
<textarea class="w-full p-4 rounded-DEFAULT font-body-lg text-on-surface resize-none bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary pb-12" placeholder="Detailed operational notes..." rows="4"></textarea>
<!-- Voice Input Button (Floating inside textarea) -->
<button aria-label="Start voice dictation" class="absolute bottom-3 right-3 w-10 h-10 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-sm hover:bg-secondary-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined">mic</span>
</button>
<span class="absolute bottom-5 left-4 font-label-md text-label-md text-on-surface-variant">0/500 chars</span>
</div>
</section>
</form>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t-2 border-outline-variant p-margin-mobile pb-8 z-50">
<button class="w-full h-[56px] bg-[#fd761a] text-white font-headline-md text-headline-md font-bold rounded-DEFAULT flex items-center justify-center gap-2 hover:bg-[#e66a17] transition-colors active:scale-[0.98] shadow-[0_4px_0_0_#9d4300]" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">upload_file</span>
            Submit Receipt
        </button>
</div>
<!-- Script for interactive elements (Toggle visual sync) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggles = document.querySelectorAll('.toggle-checkbox');
            
            toggles.forEach(toggle => {
                toggle.addEventListener('change', (e) => {
                    const parentLabel = e.target.closest('label.flex');
                    if(e.target.checked) {
                        parentLabel.classList.add('border-primary');
                        parentLabel.classList.remove('border-outline-variant');
                        e.target.nextElementSibling.classList.add('bg-primary');
                        e.target.nextElementSibling.classList.remove('bg-outline-variant');
                        e.target.classList.add('border-primary');
                        e.target.classList.remove('border-outline-variant');
                        e.target.style.transform = 'translateX(100%)';
                    } else {
                        parentLabel.classList.remove('border-primary');
                        parentLabel.classList.add('border-outline-variant');
                        e.target.nextElementSibling.classList.remove('bg-primary');
                        e.target.nextElementSibling.classList.add('bg-outline-variant');
                        e.target.classList.remove('border-primary');
                        e.target.classList.add('border-outline-variant');
                        e.target.style.transform = 'translateX(0)';
                    }
                });
            });
        });
    </script>
</body></html>
