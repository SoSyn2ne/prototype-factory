<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPU Incident Timeline Annotator</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
      <div class="top__inner">
        <div>
          <div class="kicker">2026-03-09-p002</div>
          <h1>GPU Incident Timeline Annotator</h1>
          <p class="sub">Paste logs → detect anomalies → annotate → export Markdown.</p>
        </div>
        <div class="top__actions">
          <button id="btnAnalyze" class="btn btn--primary" type="button">Analyze</button>
          <button id="btnExport" class="btn" type="button">Export Markdown</button>
        </div>
      </div>
    </header>

    <main id="main" class="layout">
      <section class="panel" aria-label="Inputs">
        <h2>Inputs</h2>
        <div class="grid">
          <div class="field">
            <label for="tempThresh">Temp threshold (°C)</label>
            <input id="tempThresh" type="number" min="50" max="110" value="85" />
          </div>
          <div class="field">
            <label for="utilThresh">Utilization threshold (%)</label>
            <input id="utilThresh" type="number" min="0" max="100" value="98" />
          </div>
          <div class="field">
            <label for="severityFilter">Severity filter</label>
            <select id="severityFilter">
              <option value="all">All</option>
              <option value="info">Info</option>
              <option value="warn">Warn</option>
              <option value="critical">Critical</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="logs">Paste logs</label>
          <textarea id="logs" rows="14" spellcheck="false"></textarea>
          <div class="hint">Supported patterns: ISO timestamps, "Mar 9 05:12:33", keywords like Xid, throttle, OOM, segfault.</div>
        </div>
      </section>

      <section class="panel" aria-label="Timeline">
        <h2>Timeline</h2>
        <div id="summary" class="summary" aria-live="polite"></div>
        <div id="timeline" class="timeline" role="list" aria-label="Detected events"></div>
      </section>
    </main>

    <dialog id="dlg" class="dlg">
      <form method="dialog" class="dlg__inner">
        <div class="dlg__head">
          <h3 id="dlgTitle">Event</h3>
          <button class="btn" value="cancel" aria-label="Close">Close</button>
        </div>
        <div id="dlgMeta" class="dlg__meta"></div>
        <div class="field">
          <label for="dlgNote">Annotation</label>
          <textarea id="dlgNote" rows="5" placeholder="What happened? What did you try? What’s next?"></textarea>
        </div>
        <menu class="dlg__actions">
          <button id="btnSaveNote" class="btn btn--primary" value="default">Save annotation</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="./assets/app.js"></script>
  </body>
</html>
