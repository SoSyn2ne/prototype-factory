<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shareable Scorecard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#92001e",
                        "inverse-on-surface": "#313030",
                        "on-error-container": "#ffdad6",
                        "secondary": "#ecffe3",
                        "on-secondary-fixed": "#002203",
                        "on-tertiary-container": "#ca002d",
                        "on-secondary-container": "#007117",
                        "surface-container-high": "#2a2a2a",
                        "primary-fixed-dim": "#b9d200",
                        "outline-variant": "#464932",
                        "primary-container": "#d4f000",
                        "surface-container-low": "#1c1b1b",
                        "outline": "#909378",
                        "primary": "#ffffff",
                        "surface-dim": "#131313",
                        "on-secondary": "#003907",
                        "on-primary-container": "#5d6b00",
                        "secondary-fixed-dim": "#00e639",
                        "surface-variant": "#353534",
                        "primary-fixed": "#d4f000",
                        "on-primary-fixed": "#191e00",
                        "tertiary-fixed": "#ffdad8",
                        "on-surface": "#e5e2e1",
                        "tertiary": "#ffffff",
                        "secondary-container": "#13ff43",
                        "on-background": "#e5e2e1",
                        "surface-bright": "#3a3939",
                        "on-primary": "#2d3400",
                        "surface-container": "#201f1f",
                        "on-tertiary": "#680012",
                        "surface-container-highest": "#353534",
                        "surface": "#131313",
                        "on-error": "#690005",
                        "inverse-primary": "#586400",
                        "on-tertiary-fixed": "#410008",
                        "tertiary-container": "#ffdad8",
                        "surface-container-lowest": "#0e0e0e",
                        "error-container": "#93000a",
                        "on-primary-fixed-variant": "#424b00",
                        "on-surface-variant": "#c6c9ab",
                        "on-secondary-fixed-variant": "#00530e",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#ffb3b2",
                        "inverse-surface": "#e5e2e1",
                        "secondary-fixed": "#72ff70",
                        "background": "#131313",
                        "surface-tint": "#b9d200"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "unit": "8px",
                        "receipt-width": "400px",
                        "margin-desktop": "48px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Anybody"],
                        "display-lg": ["Anybody"],
                        "label-sm": ["Space Mono"],
                        "data-mono": ["Space Mono"],
                        "headline-lg": ["Anybody"],
                        "body-lg": ["Space Mono"],
                        "headline-md": ["Anybody"],
                        "body-md": ["Space Mono"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["32px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "display-lg": ["72px", { "lineHeight": "72px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "data-mono": ["16px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg": ["48px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .zigzag-border {
            position: relative;
        }
        .zigzag-border::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(135deg, transparent 50%, #1c1b1b 50%),
                        linear-gradient(-135deg, transparent 50%, #1c1b1b 50%);
            background-size: 20px 10px;
            background-repeat: repeat-x;
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-lg antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Top Navigation (Shell logic: Suppressed on this specific focused share screen to prioritize the shareable canvas, but keeping the shared component structure intact for demonstration if it were a top level view. However, based on "Destination Rule", we hide it as this is a specific task/share view. ) -->
<!-- Navigation omitted as per Shell Visibility rules for transactional/task-focused screens -->
<!-- Main Content Canvas -->
<main class="w-full max-w-lg flex flex-col items-center gap-8 relative z-10">
<!-- Shareable Graphic Container -->
<div class="bg-surface-container-low border border-primary w-full aspect-square relative flex flex-col items-center justify-between p-6 overflow-hidden zigzag-border shadow-[0_0_30px_rgba(212,240,0,0.15)] group hover:shadow-[0_0_50px_rgba(212,240,0,0.3)] transition-shadow duration-500" id="shareable-graphic">
<!-- Background Texture -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#d4f000 1px, transparent 1px); background-size: 20px 20px;"></div>
<!-- Header -->
<div class="text-center z-10 w-full">
<div class="flex items-center justify-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary-fixed text-headline-md" style="font-variation-settings: 'FILL' 1;">token</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tighter uppercase">FEE CREEP ARCADE</h1>
</div>
<div class="bg-surface border-t border-b border-surface-variant py-2 mt-4">
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">MegaCorp Telecom Analysis</h2>
</div>
</div>
<!-- Core Data: The "Receipt" Core -->
<div class="flex-1 w-full flex flex-col items-center justify-center gap-6 z-10 py-6">
<!-- Fairness Badge -->
<div class="flex flex-col items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase">Fairness Score</span>
<div class="bg-surface border-2 border-error text-error px-4 py-2 shadow-[0_0_15px_rgba(255,180,171,0.4)] transform -rotate-2">
<span class="font-headline-lg text-headline-lg font-bold">F</span>
</div>
</div>
<!-- Total Fees -->
<div class="text-center w-full bg-surface-container py-4 border border-surface-variant relative">
<span class="font-label-sm text-label-sm text-on-surface-variant absolute top-2 left-3 uppercase">Total Junk Fees</span>
<div class="font-display-lg text-display-lg text-error font-extrabold mt-4">
                        $142<span class="text-headline-md">.50</span>
</div>
</div>
<!-- Gouge Meter -->
<div class="w-full flex flex-col gap-2">
<div class="flex justify-between items-end w-full">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Gouge Meter Ranking</span>
<span class="font-data-mono text-data-mono text-error">CRITICAL</span>
</div>
<!-- Meter Bar -->
<div class="w-full h-4 flex gap-1 bg-surface border border-surface-variant p-0.5">
<div class="h-full flex-1 bg-secondary-fixed-dim"></div>
<div class="h-full flex-1 bg-secondary-fixed-dim"></div>
<div class="h-full flex-1 bg-primary-fixed"></div>
<div class="h-full flex-1 bg-primary-fixed"></div>
<div class="h-full flex-1 bg-error shadow-[0_0_10px_rgba(255,180,171,0.8)]"></div>
<div class="h-full flex-1 bg-error animate-pulse shadow-[0_0_15px_rgba(255,180,171,1)]"></div>
</div>
</div>
</div>
<!-- Footer / CTA -->
<div class="z-10 text-center w-full pt-4 border-t border-surface-variant">
<p class="font-data-mono text-data-mono text-primary-fixed uppercase tracking-wider">
                    Scan your receipts at<br/>
<span class="text-primary border-b border-primary-fixed pb-0.5">FeeCreepArcade.com</span>
</p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-4 w-full justify-center mt-4">
<button class="bg-surface text-primary border border-primary h-14 px-6 flex items-center justify-center gap-2 font-data-mono text-data-mono uppercase tracking-wider shadow-[0_4px_0_0_#ffffff] hover:translate-y-[2px] hover:shadow-[0_2px_0_0_#ffffff] active:translate-y-[4px] active:shadow-none transition-all">
<span class="material-symbols-outlined">download</span>
                Save
            </button>
<button class="bg-primary text-on-primary h-14 px-8 flex items-center justify-center gap-2 font-data-mono text-data-mono font-bold uppercase tracking-wider shadow-[0_4px_0_0_#b9d200] hover:translate-y-[2px] hover:shadow-[0_2px_0_0_#b9d200] active:translate-y-[4px] active:shadow-none transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">ios_share</span>
                Share Score
            </button>
</div>
</main>
</body></html>
