<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding - Crisis Binder</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#0b1c30",
                        "primary-fixed-dim": "#b9c7e3",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#0e1c31",
                        "background": "#fbf9fb",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#101e33",
                        "surface": "#fbf9fb",
                        "primary": "#000410",
                        "surface-container-high": "#eae7e9",
                        "on-background": "#1b1b1d",
                        "surface-variant": "#e4e2e4",
                        "outline": "#75777d",
                        "on-tertiary-fixed": "#002116",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#c3ecd9",
                        "on-secondary-container": "#54647a",
                        "on-surface-variant": "#44474d",
                        "surface-container-highest": "#e4e2e4",
                        "surface-tint": "#515f77",
                        "secondary-container": "#d0e1fb",
                        "tertiary": "#000503",
                        "on-primary-container": "#7986a0",
                        "on-primary-fixed-variant": "#3a475e",
                        "outline-variant": "#c5c6cd",
                        "inverse-primary": "#b9c7e3",
                        "on-tertiary-container": "#678e7d",
                        "surface-dim": "#dbd9db",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1b1b1d",
                        "secondary-fixed-dim": "#b7c8e1",
                        "inverse-surface": "#303032",
                        "on-error": "#ffffff",
                        "secondary": "#505f76",
                        "surface-container-low": "#f5f3f5",
                        "inverse-on-surface": "#f2f0f2",
                        "on-tertiary-fixed-variant": "#294e40",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#d6e3ff",
                        "surface-bright": "#fbf9fb",
                        "tertiary-fixed-dim": "#a7cfbd",
                        "surface-container": "#efedef",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#d3e4fe",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary-container": "#002318"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "48px",
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "base": "8px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Public Sans"],
                        "body-md": ["Public Sans"],
                        "body-lg": ["Public Sans"],
                        "label-sm": ["Public Sans"],
                        "headline-md": ["Public Sans"],
                        "headline-lg-mobile": ["Public Sans"],
                        "label-md": ["Public Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Base styles to ensure consistency */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom radio button styling to hide default input but keep accessibility */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Selected state styling applied via JS */
        .option-card.selected {
            border-color: theme('colors.primary');
            background-color: theme('colors.secondary-container');
        }
        
        .option-card.selected .icon-container {
            color: theme('colors.primary');
        }
        
        .option-card.selected .card-title {
            color: theme('colors.on-secondary-container');
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md text-body-md">
<!-- Minimal Header for Onboarding (Nav Shell Suppressed) -->
<header class="w-full p-margin-mobile md:p-margin-desktop flex justify-center items-center">
<span class="font-headline-md text-headline-md text-primary opacity-80 tracking-tight">Crisis Binder</span>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col justify-center items-center px-gutter w-full max-w-3xl mx-auto py-section-gap">
<!-- Reassuring Intro & Question -->
<div class="text-center mb-stack-md w-full">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-stack-sm">
                What happened to Mom/Dad today?
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mx-auto">
                Take a deep breath. We'll help you organize the next steps based on the situation. Select the most appropriate option to begin.
            </p>
</div>
<!-- Options Grid -->
<form class="w-full" id="onboarding-form">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-stack-sm mb-section-gap">
<!-- Option: Fall -->
<label class="option-card cursor-pointer border border-outline-variant bg-surface-container-lowest rounded-lg p-stack-md transition-all duration-200 hover:bg-surface-container-low flex flex-col items-start gap-stack-sm">
<input class="visually-hidden" name="incident_type" type="radio" value="fall"/>
<div class="icon-container text-secondary bg-surface-container p-base rounded-full inline-flex transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">personal_injury</span>
</div>
<div>
<h2 class="card-title font-headline-md text-headline-md text-on-surface mb-1 transition-colors">A Fall</h2>
<p class="font-body-md text-body-md text-on-surface-variant">They experienced a slip, trip, or fall, requiring monitoring or care.</p>
</div>
</label>
<!-- Option: New Diagnosis -->
<label class="option-card cursor-pointer border border-outline-variant bg-surface-container-lowest rounded-lg p-stack-md transition-all duration-200 hover:bg-surface-container-low flex flex-col items-start gap-stack-sm">
<input class="visually-hidden" name="incident_type" type="radio" value="diagnosis"/>
<div class="icon-container text-secondary bg-surface-container p-base rounded-full inline-flex transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">medical_information</span>
</div>
<div>
<h2 class="card-title font-headline-md text-headline-md text-on-surface mb-1 transition-colors">New Diagnosis</h2>
<p class="font-body-md text-body-md text-on-surface-variant">A doctor recently confirmed a new condition or change in health status.</p>
</div>
</label>
<!-- Option: Hospitalization -->
<label class="option-card cursor-pointer border border-outline-variant bg-surface-container-lowest rounded-lg p-stack-md transition-all duration-200 hover:bg-surface-container-low flex flex-col items-start gap-stack-sm">
<input class="visually-hidden" name="incident_type" type="radio" value="hospitalization"/>
<div class="icon-container text-secondary bg-surface-container p-base rounded-full inline-flex transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">local_hospital</span>
</div>
<div>
<h2 class="card-title font-headline-md text-headline-md text-on-surface mb-1 transition-colors">Hospitalization</h2>
<p class="font-body-md text-body-md text-on-surface-variant">They have been admitted to the ER, hospital, or a care facility.</p>
</div>
</label>
<!-- Option: General Decline -->
<label class="option-card cursor-pointer border border-outline-variant bg-surface-container-lowest rounded-lg p-stack-md transition-all duration-200 hover:bg-surface-container-low flex flex-col items-start gap-stack-sm">
<input class="visually-hidden" name="incident_type" type="radio" value="decline"/>
<div class="icon-container text-secondary bg-surface-container p-base rounded-full inline-flex transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">trending_down</span>
</div>
<div>
<h2 class="card-title font-headline-md text-headline-md text-on-surface mb-1 transition-colors">General Decline</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Noticing gradual changes in memory, mobility, or daily functioning.</p>
</div>
</label>
</div>
<!-- Action Area -->
<div class="flex justify-center md:justify-end w-full border-t border-outline-variant pt-stack-md">
<button class="bg-primary text-on-primary font-label-md text-label-md py-3 px-8 rounded-DEFAULT opacity-50 cursor-not-allowed transition-all hover:bg-primary-container hover:text-on-primary-container w-full md:w-auto" disabled="" id="continue-btn" type="button">
                    Continue to Plan
                </button>
</div>
</form>
</main>
<!-- Simple Interaction Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const radioInputs = document.querySelectorAll('input[name="incident_type"]');
            const optionCards = document.querySelectorAll('.option-card');
            const continueBtn = document.getElementById('continue-btn');

            radioInputs.forEach(input => {
                input.addEventListener('change', (e) => {
                    // Remove selected class from all
                    optionCards.forEach(card => card.classList.remove('selected'));
                    
                    // Add selected class to the checked one's parent label
                    if (e.target.checked) {
                        e.target.closest('.option-card').classList.add('selected');
                        
                        // Enable the continue button
                        continueBtn.disabled = false;
                        continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                });
            });
        });
    </script>
</body></html>
