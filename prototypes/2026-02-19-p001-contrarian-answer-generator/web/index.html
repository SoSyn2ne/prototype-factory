<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contrarian Answer Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero card">
        <p class="eyebrow">P001 · Decision Stress Test</p>
        <h1>Contrarian Answer Generator</h1>
        <p>
          AI 답변 A를 그대로 믿지 말고, 반대 가설·실패 모드·반증 질문으로 의사결정을
          압축 검증하세요.
        </p>
      </section>

      <section class="input card">
        <label for="answerA">Answer A</label>
        <textarea id="answerA" rows="8" placeholder="검토할 AI 답변을 붙여넣어 주세요."></textarea>

        <label for="context">Context (optional)</label>
        <textarea id="context" rows="4" placeholder="의사결정 맥락(기한/제약/목표)을 입력하세요."></textarea>

        <div class="controls">
          <label class="switch" for="aggressive">
            <input id="aggressive" type="checkbox" />
            <span>Aggressive 모드</span>
          </label>
          <button id="generateBtn" type="button">Generate</button>
        </div>
      </section>

      <section class="output card" id="output" aria-live="polite">
        <p class="hint">입력 후 Generate를 누르면 구조화된 반대 분석이 생성됩니다.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
