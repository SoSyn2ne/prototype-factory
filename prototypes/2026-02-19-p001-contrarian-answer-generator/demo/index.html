<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contrarian Answer Generator Demo</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="intro">
        <p class="id">2026-02-19-p001</p>
        <h1>Contrarian Answer Generator</h1>
        <p>
          Paste a claim and force a disciplined challenge: alternate hypotheses,
          falsification questions, and confidence tags before acting.
        </p>
      </section>

      <section class="panel">
        <form id="claim-form" class="card" aria-label="Contrarian generation form">
          <h2>Input Claim</h2>
          <label for="claim">Claim to challenge</label>
          <textarea
            id="claim"
            rows="5"
            placeholder="Example: Rolling out AI chat support will cut cost by 30% within one quarter."
          ></textarea>

          <label for="context">Context (optional)</label>
          <input
            id="context"
            type="text"
            placeholder="Team size, deadline, budget pressure, etc."
          />

          <label class="toggle" for="aggressive">
            <input id="aggressive" type="checkbox" />
            <span>Aggressive mode (assume downside first)</span>
          </label>

          <button type="submit">Generate Contrarian View</button>
        </form>

        <section class="card output" aria-live="polite">
          <h2>Generated Output</h2>

          <div>
            <h3>Contrarian hypotheses</h3>
            <ul id="hypotheses"></ul>
          </div>

          <div>
            <h3>Falsification questions</h3>
            <ul id="questions"></ul>
          </div>

          <div>
            <h3>Confidence tags</h3>
            <div id="tags" class="tags"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="./assets/app.js" defer></script>
  </body>
</html>
